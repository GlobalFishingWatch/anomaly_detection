      pipe3_vessel_characterisation_broken:
        dataset: ${{andres_scratch}}
        table: pipe_3_archive_features_by_ssvid
  - name: vessel_characteristics_by_ssvid
    description: Classifications from the vessel characterisation model
    latest_version: 3.0.0
    versions:
      3.0.0:
        dataset: ${{internal}}
        table: vessel_characteristics_by_ssvid_
      2.5:
        dataset: ${{production}}
        table: vessel_characteristics_by_ssvid_
