      vessel_characterisation_sample_202012_stationary_filter:
        dataset: ${{andres_scratch}}
        table: stationary_filter_vessel_characteristics_by_ssvid_
      vessel_characterisation_pipe2_code:
        dataset: ${{andres_scratch}}
        table: monthly_group_vessel_characteristics_by_ssvid_
      vessel_characterisation_pipe2_original:
        dataset: ${{chris_scratch}}
        table: pipe2_vessel_characteristics_sample_
      pipe3_vessel_characterisation_broken:
        dataset: ${{andres_scratch}}
        table: pipe_3_archive_vessel_characteristics_by_ssvid_
