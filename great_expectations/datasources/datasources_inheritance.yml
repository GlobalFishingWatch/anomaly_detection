    description: AIS ML features used in the fishing model estimates
    latest_version: 3.0.0
    versions:
      3.0.0:
        dataset: ${{internal}}
        table: features_
      2.5:
        dataset: ${{production}}
        table: features_
  - name: features_by_ssvid
    description: AIS ML features used in the vessel characterisation model
    latest_version: 3.0.0
    versions:
      3.0.0:
        dataset: ${{internal}}
        table: features_by_ssvid
      2.5:
        dataset: ${{production}}
        table: features_by_ssvid_
      vessel_characterisation_sample_202012_base:
        dataset: ${{andres_scratch}}
        table: stationary_filter_features_by_ssvid
      vessel_characterisation_sample_202012_stationary_filter:
        dataset: ${{andres_scratch}}
        table: stationary_filter_features_by_ssvid
      vessel_characterisation_pipe2_code:
        dataset: ${{andres_scratch}}
