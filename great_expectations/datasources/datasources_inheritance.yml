config_version: 2.0.0
datasources_version: 1.0.0
project: gfw-google-827
environments:
  - dev:
    version: 3.0.0
  - prod:
    version: 2.5
pipe_versions:
  - 3.0.0:
    - datasets:
      - internal
      - published
      - andres_scratch
  - 2.5:
    - datasets:
      - production
      - vessel_database
  - v3_backup:
    - datasets:
      - backup
  - vessel_characterisation_sample_202012_base:
    - datasets:
      - andres_scratch
  - vessel_characterisation_sample_202012_stationary_filter:
    - datasets:
      - andres_scratch
  - vessel_characterisation_pipe2_code:
    - datasets:
      - andres_scratch
  - vessel_characterisation_pipe2_original:
    - datasets:
      - andres_scratch 
      - chris_scratch
  - pipe3_vessel_characterisation_broken:
    - datasets:
      - andres_scratch
  - 3.0.0_gapfix:
    - datasets:
      - ml_dev
  - 3.0.0_gapfix_larger_sample:
    - datasets:
      - ml_dev
  - 3.0.0_gapfix_3:
    - datasets:
      - ml_dev
sources:
  - ais
  - brazil_vms
  - orbcomm
  - marine_traffice
datasets:
  ais:
    versions:
      3.0.0:
        internal: pipe_ais_v3_internal
        published: pipe_ais_v3_published
        andres_scratch: scratch_andres_ttl30d
      2.5:
        production: pipe_production_v20201001
        vessel_database: vessel_database
      v3_backup:
        backup: backup_ttl_60d_pipe_ais_v3_alpha
      vessel_characterisation_sample_202012_base:
        andres_scratch: scratch_andres_ttl30d
      vessel_characterisation_sample_202012_stationary_filter:
        andres_scratch: scratch_andres_ttl30d
      vessel_characterisation_pipe2_code:
        andres_scratch: scratch_andres_ttl30d
      vessel_characterisation_pipe2_original:
        andres_scratch: scratch_andres_ttl30d
        chris_scratch: scratch_christian_homberg_ttl120d
      pipe3_vessel_characterisation_broken:
        andres_scratch: scratch_andres_ttl30d
      3.0.0_gapfix:
        ml_dev: machine_learning_dev_ttl_120d
      3.0.0_gapfix_larger_sample:
        ml_dev: machine_learning_dev_ttl_120d
      3.0.0_gapfix_3:
        ml_dev: machine_learning_dev_ttl_120d
  brazil_vms:
    versions:
      3.0.0:
        internal: pipe_brazil_v3_staging_internal
        published: pipe_brazil_v3_staging_published
      2.5:
        production: pipe_brazil_production_v20211126
  marine_traffic:
    versions:
      3.0.0:
        internal: pipe_marinetraffic_staging_internal
        published: pipe_marinetraffic_staging_published
  orbcomm:
    versions:
      3.0.0:
        internal: pipe_orbcomm22_staging_internal
        published: pipe_orbcomm22_staging_published
datasources:
  - name: messages
    description: AIS position table (thinned)
    latest_version: 3.0.0
    versions:
      3.0.0:
        dataset: ${{published}}
        table: messages
      2.5:
        dataset: ${{production}}
        table: research_messages
  - name: research_positions
    description:
    latest_version: 3.0.0
    versions:
      3.0.0:
        dataset: ${{published}}
        table: messages
      2.5:
        dataset: ${{production}}
        table: research_positions
  - name: satellite_timing_offsets
    description: Satellite timing offsets
    latest_version: 3.0.0
    versions:
      3.0.0:
        dataset: ${{published}}
        table: satellite_timing_offsets
      2.5:
        dataset: ${{production}}
        table: research_satellite_timing
  - name: segs_activity
    description: AIS activity aggregated at the segment level with noise indicators
    latest_version: 3.0.0
    versions:
      3.0.0:
        dataset: ${{published}}
        table: segs_activity
      2.5:
        dataset: ${{production}}
        table: research_segs
  - name: segs_activity_daily
    description: AIS activity aggregated at the daily segment level with noise indicators
    latest_version: 3.0.0
    versions:
      3.0.0:
        dataset: ${{published}}
        table: segs_activity_daily
      2.5:
        dataset: ${{production}}
        table: research_segs_daily
  - name: ssvids_identities
    description: Aggregated raw AIS identity information by ssvid
    latest_version: 3.0.0
    versions:
      3.0.0:
        dataset: ${{published}}
        table: ssvids_identities
      2.5:
        dataset: ${{production}}
        table: research_ids
  - name: ssvids_identities_daily
    description: Daily raw AIS identity information by ssvid
    latest_version: 3.0.0
    versions:
      3.0.0:
        dataset: ${{published}}
        table: ssvids_identities_daily
      2.5:
        dataset: ${{production}}
        table: research_ids_daily
  - name: stats_daily
    description: Stats on AIS data daily
    latest_version: 3.0.0
    versions:
      3.0.0:
        dataset: ${{published}}
        table: stats_daily
      2.5:
        dataset: ${{production}}
        table: research_stats
  - name: vessel_info
    description: Aggregated vessel identity information by vessel id and ssvid
    latest_version: 3.0.0
    versions:
      3.0.0:
        dataset: ${{published}}
        table: vessel_info
      2.5:
        dataset: ${{production}}
        table: vessel_info
