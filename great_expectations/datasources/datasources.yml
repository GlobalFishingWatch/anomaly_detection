config_version: 1.0.0
datasources_version: 1.0.0
project: gfw-google-827
environments:
  - dev:
    version: 3.0.0
  - prod:
    version: 2.5
datasources:
  - name: messages
    description: AIS position table (thinned)
    latest_version: 3.0.0
    versions:
      3.0.0:
        dataset: pipe_ais_v3_alpha_published
        table: messages
      2.5:
        dataset: pipe_production_v20201001
        table: research_messages
  - name: satellite_timing_offsets
    description: Satellite timing offsets
    latest_version: 3.0.0
    versions:
      3.0.0:
