name: gfw-google-827.constraints.fragments.3-0-0-checkpoint
config_version: 1.0
template_name:
module_name: great_expectations.checkpoint
class_name: Checkpoint
run_name_template:
expectation_suite_name: gfw-google-827.constraints.fragments.3-0-0
batch_request: {}
action_list:
  - name: store_validation_result
    action:
      class_name: StoreValidationResultAction
  - name: store_evaluation_params
    action:
      class_name: StoreEvaluationParametersAction
  - name: update_data_docs
    action:
      class_name: UpdateDataDocsAction
  - name: store_metrics
    action:
      class_name: StoreMetricsAction
      target_store_name: metric_store
      requested_metrics:
        '*':
          - statistics.successful_expectations
          - statistics.evaluated_expectations
          - statistics.success_percent
          - statistics.unsuccessful_expectations
          - expect_table_row_count_to_be_between.result.observed_value
evaluation_parameters: {}
runtime_configuration: {}
validations: []
profilers: []
ge_cloud_id:
expectation_suite_ge_cloud_id:
