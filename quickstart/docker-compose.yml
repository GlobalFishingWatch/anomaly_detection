version: '3.8'

services:
  dataloader-demo:
    build:
      context: ../dataloader/ci/executor
      dockerfile: Dockerfile
    platform: linux/amd64
    volumes:
      - '~/.config/gcloud:/root/.config/gcloud'
      - './config_demo.yaml:/project/config_demo.yaml'
    environment:
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - BQ_DATASET=${BQ_DATASET:-anomaly_detection_demo}
    command: >
      bash -c "
        echo 'Starting Anomaly Detection Demo...';
        echo 'Project: ${GCP_PROJECT_ID}';
        echo 'Dataset: ${BQ_DATASET:-anomaly_detection_demo}';
        echo '';
        echo 'Running forecast for citibike_daily_trips...';
        Rscript /project/forecast.R 
          --environment=demo 
          --anomaly_detection_config_name=citibike_daily_trips
          --project_id=${GCP_PROJECT_ID}
          --dataset_id=${BQ_DATASET:-anomaly_detection_demo}
          --config_path=/project/config_demo.yaml &&
        echo '';
        echo 'Running forecast for weather_impact_demo...';
        Rscript /project/forecast.R 
          --environment=demo 
          --anomaly_detection_config_name=weather_impact_demo
          --project_id=${GCP_PROJECT_ID}
          --dataset_id=${BQ_DATASET:-anomaly_detection_demo}
          --config_path=/project/config_demo.yaml &&
        echo '';
        echo 'Demo completed! Check your BigQuery dataset for results.';
        echo '';
        echo 'Query your results:';
        echo 'bq query --use_legacy_sql=false \"SELECT * FROM \`${GCP_PROJECT_ID}.${BQ_DATASET:-anomaly_detection_demo}.t_demo_forecasts\` LIMIT 10\"';
        echo '';
        echo 'Check for anomalies (if any):';
        echo 'bq query --use_legacy_sql=false \"SELECT * FROM \`${GCP_PROJECT_ID}.${BQ_DATASET:-anomaly_detection_demo}.t_demo_actuals\` WHERE timestamp >= TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 30 DAY) LIMIT 10\"';
      "

  results-viewer:
    image: google/cloud-sdk:alpine
    volumes:
      - '~/.config/gcloud:/root/.config/gcloud'
    environment:
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - BQ_DATASET=${BQ_DATASET:-anomaly_detection_demo}
    command: >
      bash -c "
        echo 'Demo Results Summary';
        echo '===================';
        echo '';
        echo 'Forecast Records:';
        bq query --use_legacy_sql=false --format=table 
          \"SELECT COUNT(*) as forecast_count, 
                  MIN(timestamp) as earliest_date,
                  MAX(timestamp) as latest_date,
                  COUNT(DISTINCT config_name) as configs
           FROM \`${GCP_PROJECT_ID}.${BQ_DATASET}.t_demo_forecasts\`\" || echo 'No forecasts found';
        echo '';
        echo 'Actual Records:';
        bq query --use_legacy_sql=false --format=table 
          \"SELECT COUNT(*) as actual_count,
                  MIN(timestamp) as earliest_date, 
                  MAX(timestamp) as latest_date,
                  COUNT(DISTINCT config_name) as configs
           FROM \`${GCP_PROJECT_ID}.${BQ_DATASET}.t_demo_actuals\`\" || echo 'No actuals found';
        echo '';
        echo 'Sample Forecasts (Latest 5):';
        bq query --use_legacy_sql=false --format=table 
          \"SELECT config_name, timestamp, forecast_method, value 
           FROM \`${GCP_PROJECT_ID}.${BQ_DATASET}.t_demo_forecasts\` 
           WHERE is_latest = true 
           ORDER BY timestamp DESC 
           LIMIT 5\" || echo 'No forecast data available';
        echo '';
        echo 'Demo completed successfully!';
        echo '';
        echo 'View in BigQuery Console:';
        echo 'https://console.cloud.google.com/bigquery?project=${GCP_PROJECT_ID}&ws=!1m5!1m4!4m3!1s${GCP_PROJECT_ID}!2s${BQ_DATASET}!3sViews';
      "
    profiles: ["results"]