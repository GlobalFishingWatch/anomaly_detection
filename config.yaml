anomalies:
  pipe3_stats_daily_raw_positions:
    source_dataset: "pipe_ais_v3_alpha_published"
    source_table: "stats_daily"
    source_timestamp_column: "date"
    source_timestamp_column_sql: "CAST(date AS TIMESTAMP)"
    source_forecast_column: "raw_positions"
    source_forecast_column_sql: "MAX(raw_positions)"
    algorithms: 
        mstl: 
            parameters: 
              season_length: 
                - 365.25
                - 7
        mean:
            parameters:
              sliding_window: 30
  pipe3_stats_daily_num_ssvid:
    source_dataset: "pipe_ais_v3_alpha_published"
    source_table: "stats_daily"
    source_timestamp_column: "date"
    source_timestamp_column_sql: "CAST(date AS TIMESTAMP)"
    source_forecast_column: "num_ssvid"
    source_forecast_column_sql: "MAX(num_ssvid)"
    algorithms: 
        mstl: 
            parameters: 
              season_length: 
                - 365.25
                - 7
            thresholds:
              low: .01
              high: .1
        mean:
            parameters:
              sliding_window: 30
            thresholds:
              low: .03
              high: .15
