steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'build',
        '-f',
        './executor/Dockerfile',
        '-t',
        'gcr.io/world-fishing-827/github.com/globalfishingwatch/anomaly-detection:$TAG_NAME',
        './executor',
      ]
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'tag',
        'gcr.io/world-fishing-827/github.com/globalfishingwatch/anomaly-detection:$TAG_NAME',
        'gcr.io/world-fishing-827/github.com/globalfishingwatch/anomaly-detection:latest',
      ]
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'push',
        'gcr.io/world-fishing-827/github.com/globalfishingwatch/anomaly-detection:$TAG_NAME',
      ]
  # Deploy to the appropriate environment
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      [
        'run',
        'jobs',
        'update',
        '$_JOB_SERVICE_NAME',
        '--project',
        '$_RUN_PROJECT',
        '--image',
        'gcr.io/world-fishing-827/github.com/globalfishingwatch/anomaly-detection:$TAG_NAME',
        '--region',
        '$_RUN_REGION',
      ]

images:
  - 'gcr.io/world-fishing-827/github.com/globalfishingwatch/anomaly-detection:$TAG_NAME'
  - 'gcr.io/world-fishing-827/github.com/globalfishingwatch/anomaly-detection:latest'

timeout: 900s