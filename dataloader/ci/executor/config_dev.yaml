  parsed_row_count_hourly:
      source_project: "world-fishing-827"
      source_dataset: tech_dq_monitoring
      source_table: v_all_partitions_latest
      source_timestamp_column: partition_hour
      source_timestamp_column_sql: TIMESTAMP(partition_hour)
      source_forecast_column: total_rows
      source_forecast_column_sql: total_rows
      period_length: hour
      history_start: "30 days"
      source_sql: '
      total_rows AS value, TIMESTAMP(partition_hour) AS timestamp, "" AS dimension_split_value
      FROM `world-fishing-827.tech_dq_monitoring.v_all_partitions_latest` 
      WHERE schema_table_name = "pipe_nmea_hourly.pipe-nmea-parsed-hourly"
      AND partition_id IS NOT NULL
      QUALIFY ROW_NUMBER() OVER (ORDER BY partition_hour DESC) > 3 --the last 3 hours might not be final yet
      ORDER BY timestamp, dimension_split_value
      '
      algorithms:
          mstl: 
              parameters: 
                season_length: 
                  - 168
                  - 24
          mean:
              parameters:
                sliding_window: 72
          median:
              parameters:
                sliding_window: 72
  gfw_api_delays:
      source_project: "world-fishing-827"
      source_dataset: tech_dq_monitoring
      source_table: v_scraped_api_values
      source_timestamp_column: timestamp
      source_timestamp_column_sql: timestamp
      source_forecast_column: timestamp_delay_hour_now_hypothetical
      source_forecast_column_sql: MIN(timestamp_delay_hour_now_hypothetical)
      period_length: day
      dimension_split: dataset
      history_start: '2025-01-31'
      source_filter_sql: "
      date_interval = 'DAY' 
      AND timestamp_delay_hour_now_hypothetical IS NOT NULL
      AND date >= '2025-01-31'
      AND DATE_DIFF(CURRENT_DATE(), date, DAY) >= 4"
      algorithms:
          constant_value:
              parameters:
                value: 0.5
  s2_index_delays:
      source_project: "world-fishing-827"
      source_dataset: tech_dq_monitoring
      source_table: v_s2_index_delays
      source_timestamp_column: timestamp
      source_timestamp_column_sql: timestamp
      source_forecast_column: timestamp_delay_minute_now_hypothetical
      source_forecast_column_sql: MIN(timestamp_delay_minute_now_hypothetical)
      period_length: day
      history_start: '2025-05-29'
      source_filter_sql: "
      timestamp_lag_minute_now_hypothetical > 0
      AND date >= '2025-05-29'
      "
      algorithms:
          constant_value:
              parameters:
                value: 0.5
  s2_published_detections_delays:
