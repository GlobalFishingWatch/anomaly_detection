anomalies:
  parser_errors_daily:
      source_project: "world-fishing-827"
      source_dataset: "tech_dq_monitoring"
      source_table: "t_pipe_nmea_parsed_errors"
      source_timestamp_column: "date"
      source_timestamp_column_sql: 'TIMESTAMP(date)'
      source_forecast_column: "count"
      source_forecast_column_sql: "SUM(count)"
      period_length: "day"
      algorithms:
          mstl: 
              parameters: 
                season_length: 
                  - 365.25
                  - 7
          mean:
              parameters:
                sliding_window: 30
          median:
              parameters:
                sliding_window: 30
  parser_errors_daily_by_source:
      source_project: "world-fishing-827"
      source_dataset: "tech_dq_monitoring"
      source_table: "t_pipe_nmea_parsed_errors"
      source_timestamp_column: "date"
      source_timestamp_column_sql: 'TIMESTAMP(date)'
      source_forecast_column: "count"
      source_forecast_column_sql: "SUM(count)"
      period_length: "day"
      dimension_split: source
      algorithms:
          mstl: 
              parameters: 
                season_length: 
                  - 365.25
                  - 7
          mean:
              parameters:
                sliding_window: 30
          median:
              parameters:
                sliding_window: 30
  parsed_row_count_source_daily:
      source_project: "world-fishing-827"
      source_dataset: "tech_dq_monitoring"
      source_table: "t_facts_pipe_nmea_parsed_stats_daily"
      source_timestamp_column: "date"
      source_timestamp_column_sql: 'TIMESTAMP(date)'
      source_forecast_column: "count"
      source_forecast_column_sql: "count"
      period_length: "day"
      history_start: "2022-08-23"
      source_sql: '
      SUM(count) AS value, TIMESTAMP(date) AS timestamp, value AS dimension_split_value 
      FROM `world-fishing-827.tech_dq_monitoring.t_facts_pipe_nmea_parsed_stats_daily`
      WHERE variable = "source"
      AND {current_anomaly_detection_config$source_timestamp_column_sql} IN ({missing_timestamps_sql})
      AND {current_anomaly_detection_config$source_timestamp_column_sql} NOT IN ({existing_timestamps_sql})
      AND {current_anomaly_detection_config$source_timestamp_column_sql} >= "{history_start}"
      GROUP BY timestamp, dimension_split_value
      ORDER BY timestamp, dimension_split_value
      '
      algorithms:
          mstl: 
              parameters: 
                season_length: 
                  - 365.25
                  - 7
          mean:
              parameters:
                sliding_window: 30
          median:
              parameters:
                sliding_window: 30
  pipe3_gaps:
      source_project: "global-fishing-watch"
      source_dataset: pipe_ais_v3_published
      source_table: product_events_ais_disabling
      source_timestamp_column: event_end
