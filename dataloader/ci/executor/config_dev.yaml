      source_table: v_published_fishing_effort_v3_0_0_vs_v2_5_1
      source_timestamp_column: date
      source_timestamp_column_sql: TIMESTAMP(date)
      source_forecast_column: delta
      source_forecast_column_sql: SAFE_DIVIDE(SUM(delta), SUM(v20231026_value))
      source_filter_sql: is_latest
