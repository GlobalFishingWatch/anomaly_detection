anomalies:
  parser_errors_daily:
      source_dataset: "tech_dq_monitoring"
      source_table: "t_pipe_nmea_parsed_errors"
      source_timestamp_column: "date"
      source_timestamp_column_sql: 'TIMESTAMP(date)'
      source_forecast_column: "count"
      source_forecast_column_sql: "SUM(count)"
      period_length: "day"
      algorithms:
          mstl: 
              parameters: 
                season_length: 
                  - 365.25
                  - 7
          mean:
              parameters:
                sliding_window: 30
          median:
              parameters:
                sliding_window: 30
  fishing_effort_pipe2_5_esp_daily:
    source_dataset: "skytruth-pelagos-production.ais_global_v20231026_fishing_effort_public"
    source_table: "ais_global_v20231026_fishing_effort_public"
    source_timestamp_column: "timestamp"
    source_timestamp_column_sql: 'timestamp'
    source_forecast_column: "value"
    source_forecast_column_sql: "SUM(value)"
    period_length: "day"
    source_sql: '
    SUM(value) AS value, TIMESTAMP_TRUNC(timestamp, day) AS timestamp, "" AS dimension_split_value
    FROM `skytruth-pelagos-production.ais_global_v20231026_fishing_effort_public.ais_global_v20231026_fishing_effort_public`
    WHERE flag = "ESP"
    GROUP BY timestamp, dimension_split_value
    ORDER BY timestamp, dimension_split_value
    '
    algorithms:
        mstl: 
            parameters: 
              season_length: 
                - 365.25
                - 7
        mean:
            parameters:
              sliding_window: 30
        median:
            parameters:
              sliding_window: 30
  fishing_effort_pipe3:
    source_dataset: "skytruth-pelagos-production.ais_global_v3_fishing_effort_public"
    source_table: "fishing_effort_public"
    source_timestamp_column: "timestamp"
    source_timestamp_column_sql: 'timestamp'
    source_forecast_column: "value"
    source_forecast_column_sql: "SUM(value)"
    period_length: "day"
    history_start: "3650 days"
    algorithms:
        mstl: 
            parameters: 
              season_length: 
                - 365.25
                - 7
        mean:
            parameters:
              sliding_window: 30
        median:
            parameters:
              sliding_window: 30
  fishing_effort_pipe2_5_flag_daily:
    source_dataset: "skytruth-pelagos-production.ais_global_v20231026_fishing_effort_public"
    source_table: "ais_global_v20231026_fishing_effort_public"
    source_timestamp_column: "timestamp"
    source_timestamp_column_sql: 'timestamp'
    source_forecast_column: "value"
    source_forecast_column_sql: "SUM(value)"
    period_length: "day"
    source_sql: '
    SUM(value) AS value, TIMESTAMP_TRUNC(timestamp, day) AS timestamp, flag AS dimension_split_value
    FROM `skytruth-pelagos-production.ais_global_v20231026_fishing_effort_public.ais_global_v20231026_fishing_effort_public`
    WHERE flag IN ("ESP", "FRA", "GBR", "ITA", "MAR", "PRT", "TUR", "BRA", "NOR", "CHN", "IDN", "JPN", "KOR", "PHL", "RUS", "THA", "USA", "VNM")
    GROUP BY timestamp, dimension_split_value
    ORDER BY timestamp, dimension_split_value
    '
    algorithms:
        mstl: 
            parameters: 
              season_length: 
                - 365.25
                - 7
        mean:
            parameters:
              sliding_window: 30
        median:
            parameters:
              sliding_window: 30
  parsed_row_count_source_daily:
      source_dataset: "tech_dq_monitoring"
      source_table: "t_facts_pipe_nmea_parsed_stats_daily"
      source_timestamp_column: "date"
      source_timestamp_column_sql: 'TIMESTAMP(date)'
      source_forecast_column: "count"
      source_forecast_column_sql: "count"
      period_length: "day"
      history_start: "2022-08-23"
      source_sql: '
      SUM(count) AS value, TIMESTAMP(date) AS timestamp, value AS dimension_split_value 
      FROM `world-fishing-827.tech_dq_monitoring.t_facts_pipe_nmea_parsed_stats_daily`
      WHERE variable = "source"
      AND {current_anomaly_detection_config$source_timestamp_column_sql} IN ({missing_timestamps_sql})
      AND {current_anomaly_detection_config$source_timestamp_column_sql} NOT IN ({existing_timestamps_sql})
      AND {current_anomaly_detection_config$source_timestamp_column_sql} >= "{history_start}"
      GROUP BY timestamp, dimension_split_value
      ORDER BY timestamp, dimension_split_value
      '
      algorithms:
          mstl: 
              parameters: 
                season_length: 
                  - 365.25
                  - 7
          mean:
              parameters:
                sliding_window: 30
          median:
              parameters:
                sliding_window: 30
