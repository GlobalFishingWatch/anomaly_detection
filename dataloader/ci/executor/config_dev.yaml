  parsed_row_count_main_types_daily:
      source_project: "world-fishing-827"
      source_dataset: "tech_dq_monitoring"
      source_table: "t_facts_pipe_nmea_parsed_stats_daily"
      source_timestamp_column: "date"
      source_timestamp_column_sql: 'TIMESTAMP(date)'
      source_forecast_column: "count"
      source_forecast_column_sql: "count"
      period_length: "day"
      history_start: "2022-08-23"
      source_sql: '
      SUM(count) AS value, TIMESTAMP(date) AS timestamp, value AS dimension_split_value 
