  brazil_vms_production_v20211126:
    source_dataset: "pipe_brazil_production_v20211126"
    source_table: "brazil_vms_normalized_"
    source_datetime_column: "date"
    source_datetime_column_sql: 'PARSE_TIMESTAMP("%Y%m%d", REGEXP_REPLACE(table_id, "brazil_vms_normalized_(.*)", "\\1"))'
    source_forecast_column: "count"
    source_forecast_column_sql: "COUNT(*)"
    source_sql: '
    PARSE_TIMESTAMP("%Y%m%d", REGEXP_REPLACE(table_id, "brazil_vms_normalized_(.*)", "\\1")) AS datetime, 
    row_count AS value
    FROM `world-fishing-827.pipe_brazil_production_v20211126.__TABLES__` 
    WHERE table_id LIKE "brazil_vms_normalized_%"
    AND PARSE_TIMESTAMP("%Y%m%d", REGEXP_REPLACE(table_id, "brazil_vms_normalized_(.*)", "\\1")) BETWEEN "1979-01-01" AND "2099-01-01"
    AND PARSE_TIMESTAMP("%Y%m%d", REGEXP_REPLACE(table_id, "brazil_vms_normalized_(.*)", "\\1")) IN ({missing_datetimes_sql})
    AND PARSE_TIMESTAMP("%Y%m%d", REGEXP_REPLACE(table_id, "brazil_vms_normalized_(.*)", "\\1")) NOT IN ({existing_datetimes_sql})
    ORDER BY PARSE_TIMESTAMP("%Y%m%d", REGEXP_REPLACE(table_id, "brazil_vms_normalized_(.*)", "\\1"))
    '
    history_start: "2016-01-01"
    algorithms: 
        mstl: 
            parameters: 
              season_length: 
                - 365.25
                - 7
        mean:
            parameters:
              sliding_window: 30
