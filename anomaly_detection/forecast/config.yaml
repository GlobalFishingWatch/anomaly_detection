    AND PARSE_TIMESTAMP("%Y%m%d", REGEXP_REPLACE(table_id, "norway_vms_normalized_(.*)", "\\1")) IN ({missing_datetimes_sql})
    AND PARSE_TIMESTAMP("%Y%m%d", REGEXP_REPLACE(table_id, "norway_vms_normalized_(.*)", "\\1")) NOT IN ({existing_datetimes_sql})
