  pipe_nmea_normalised_hourly:
    source_dataset: "pipe_ais_sources_v20220628"
    source_table: "pipe_nmea_normalized_*"
    source_datetime_column: "timestamp"
    source_datetime_column_sql: "TIMESTAMP_TRUNC(timestamp, hour)"
    source_forecast_column: "count"
    source_forecast_column_sql: "COUNT(*)"
    source_sql: '
    TIMESTAMP_TRUNC(timestamp, hour) AS datetime, 
    COUNT(*) AS value
    FROM `pipe_ais_sources_v20220628.pipe_nmea_normalized_*` 
    WHERE PARSE_TIMESTAMP("%Y%m%d", _TABLE_SUFFIX) BETWEEN "2023-11-01" AND "2099-01-01"
    AND TIMESTAMP_TRUNC(timestamp, hour) IN ({missing_datetimes_sql})
    AND TIMESTAMP_TRUNC(timestamp, hour) NOT IN ({existing_datetimes_sql})
    GROUP BY datetime
    ORDER BY datetime
    '
    period_length: "hour"
    history_start: "30 days"
    algorithms: 
        mstl: 
            parameters: 
              season_length: 
                - 24
                - 7
        mean:
            parameters:
              sliding_window: 30
